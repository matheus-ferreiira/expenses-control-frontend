<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">

    <!-- Viewport — viewport-fit=cover required for iPhone notch/Dynamic Island safe area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- App identity -->
    <title>VaultOS</title>
    <meta name="description" content="Seu sistema financeiro pessoal">

    <!-- Theme color (browser UI chrome on Android) -->
    <meta name="theme-color" content="#0a0a0a">

    <!-- Standard favicon -->
    <link rel="icon" href="/favicon.ico">

    <!-- PWA — iOS Safari (does not use Web App Manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VaultOS">
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
